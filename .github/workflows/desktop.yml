name: Desktop checks and unsigned Intel macOS installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: Tests and unsigned Intel macOS DMG and ZIP
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare Electron runtime
        run: npm run setup:desktop
      - name: Run unit tests
        run: npm test
      - name: Build unsigned Intel macOS DMG and ZIP without publishing
        run: npm exec electron-builder -- --mac dmg zip --x64 --publish never
      - name: Upload unsigned build for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: Workflow-macOS-Intel-x64-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-ui-smoke:
    name: Real Chromium and Electron UI regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser Canvas and media smoke test
        run: npm run test:browser
      - name: Browser reliability regression
        run: npm run test:reliability
      - name: Headless Electron desktop smoke test
        run: xvfb-run -a npm run test:desktop
